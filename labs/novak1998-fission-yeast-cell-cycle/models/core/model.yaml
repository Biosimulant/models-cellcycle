schema_version: '2.0'
title: Novak1998 - Mathematical model of fission yeast cell cycle
description: Mathematical model of the fission yeast cell cycle with checkpointcontrols at the G1/S, G2/M and metaphase/anaphase
  transitions. Model encoded by Matthieu Maire and submitted to BioModels by Krishna k.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- B Novak
- A Csikasz-Nagy
- B Gyorffy
- K Chen
- John J Tyson
