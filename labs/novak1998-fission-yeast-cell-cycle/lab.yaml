package: novak1998-fission-yeast-cell-cycle
version: 1.0.0
title: Novak1998 - Mathematical model of fission yeast cell cycle Lab
description: Single-model lab wrapper for Novak1998 - Mathematical model of fission yeast cell cycle. Mathematical
  model of the fission yeast cell cycle with checkpointcontrols at the G1/S, G2/M and metaphase/anaphase transitions.
  Model encoded by Matthieu Maire and submitted to BioModels by Krishna k.
models:
