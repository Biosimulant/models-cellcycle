schema_version: '2.0'
package: dong2018-e2f-g1-dynamics
version: 1.0.0
title: Dong2018 - E2F dynamics in G1 phase Lab
description: Single-model lab wrapper for Dong2018 - E2F dynamics in G1 phase. The length of the G1 phase in the
  cell cycle shows significant variability in different cell types and tissue types. To gain insights into the control
  of G1 length, we generated an E2F activity report.
models:
- alias: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.state
  to:
  - visualisation.cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model_state
- from: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.summary
  to:
  - visualisation.cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model_summary
- from: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.species_labels
  to:
  - visualisation.cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs: []
  outputs:
  - name: myc
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.myc
    label: Myc
    description: Tracks Myc in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.myc`.
  - name: model_state_s
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_s
    label: Model state S
    description: Tracks Model state S in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_s`.
  - name: phosphorylated_e2f
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.phosphorylated_e2f
    label: Phosphorylated E2F
    description: Tracks Phosphorylated E2F in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.phosphorylated_e2f`.
  - name: e2f_m_rna
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.e2f_m_rna
    label: E2F mRNA
    description: Tracks E2F mRNA in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.e2f_m_rna`.
  - name: rb
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.rb
    label: Rb
    description: Tracks Rb in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.rb`.
  - name: model_state_re
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_re
    label: Model state RE
    description: Tracks Model state RE in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_re`.
  - name: model_state_r_r
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_r_r
    label: Model state R (R)
    description: Tracks Model state R (R) in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_r_r`.
  - name: model_state_cd
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_cd
    label: Model state CD
    description: Tracks Model state CD in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_cd`.
  - name: model_state_ce
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_ce
    label: Model state CE
    description: Tracks Model state CE in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_ce`.
  - name: model_state_rp
    maps_to: cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_rp
    label: Model state RP
    description: Tracks Model state RP in the lab model via `cellcycle_sbml_dong2018_e2f_dynamics_in_g1_phase_model1811050001_model.model_state_rp`.
