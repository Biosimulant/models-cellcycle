schema_version: '2.0'
title: Ferrel2011 - Autonomous biochemical oscillator in regulation of CDK1, Plk1, and APC in Xenopus Laevis cell
  cycle
description: Computational modeling and the theory of nonlinear dynamical systems allow one to not simply describe
  the events of the cell cycle, but also to understand why these events occur, just as the theory of. It can be
  used to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- James E Ferrell
- Tsai TY
- Qiong Yang
upstream:
  id: biomodels_ebi:BIOMD0000000937
  source_db: biomodels_ebi
  source_id: BIOMD0000000937
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000937
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000937?filename=Ferrel2011_V3.xml
  license: CC0
biosim:
  entrypoint: src.ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000937_model:Ferrel2011AutonomousBiochemicalOscillatorInBiomd0000000937Model
  init_kwargs:
    model_path: data/BIOMD0000000937.xml
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  outputs:
  - name: cdk1_active
    maps_to: CDK1_active
    label: CDK1 Active
    description: Tracks CDK1 Active. Maps to SBML symbol `CDK1_active`.
  - name: apc_c_c_active
    maps_to: APC_active
    label: APC/C/C Active
    description: Tracks APC/C/C Active. Maps to SBML symbol `APC_active`.
  - name: plk1_active
    maps_to: Plk1_active
    label: Plk1 Active
    description: Tracks Plk1 Active. Maps to SBML symbol `Plk1_active`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream visualisation.
  - name: summary
    description: Largest-change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML symbols to human-friendly labels.
  inputs: []
