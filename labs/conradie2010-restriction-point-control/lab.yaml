schema_version: '2.0'
package: conradie2010-restriction-point-control
version: 1.0.0
title: Conradie2010_RPControl_CellCycle Lab
description: 'Single-model lab wrapper for Conradie2010_RPControl_CellCycle. This model is from the article: Restriction
  point control of the mammalian cell cycle via the cyclin E/Cdk2:p27 complex. Conradie R, Bruggeman FJ, Ciliberto
  A, Csik\u00e1sz-Nagy A, Nov\u00e1k B, Westerhoff HV,.'
models:
- alias: cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model.state
  to:
  - visualisation.cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model_state
- from: cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model.summary
  to:
  - visualisation.cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model_summary
- from: cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model.species_labels
  to:
  - visualisation.cellcycle_sbml_conradie2010_rpcontrol_cellcycle_biomd0000000265_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
