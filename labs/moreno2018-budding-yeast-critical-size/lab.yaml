schema_version: '2.0'
package: moreno2018-budding-yeast-critical-size
version: 1.0.0
title: Model of budding yeast critical cell size dependence on growth rate with parameter set 3114 Lab
description: Single-model lab wrapper for Model of budding yeast critical cell size dependence on growth rate with
  parameter set 3114. Model published in the paperChaperone availability subordinates cell cycle entry to growth
  and stressbyDavid F. Moreno1, Eva Parisi1, Galal Yahya, Federico Vaggi, Attila Csik\u00e1sz-Nagy, Mart\u00ed Aldea.
models:
- alias: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.state
  to:
  - visualisation.cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model_state
- from: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.summary
  to:
  - visualisation.cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model_summary
- from: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.species_labels
  to:
  - visualisation.cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs: []
  outputs:
  - name: folded_cln3_start_cyclin
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.folded_cln3_start_cyclin
    label: Folded Cln3 Start cyclin
    description: Tracks Folded Cln3 Start cyclin in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.folded_cln3_start_cyclin`.
  - name: unfolded_cln3_start_cyclin
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.unfolded_cln3_start_cyclin
    label: Unfolded Cln3 Start cyclin
    description: Tracks Unfolded Cln3 Start cyclin in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.unfolded_cln3_start_cyclin`.
  - name: ydj1_chaperone
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.ydj1_chaperone
    label: Ydj1 chaperone
    description: Tracks Ydj1 chaperone in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.ydj1_chaperone`.
  - name: model_state_yp
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.model_state_yp
    label: Model state YP
    description: Tracks Model state YP in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.model_state_yp`.
  - name: model_state_yc
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.model_state_yc
    label: Model state YC
    description: Tracks Model state YC in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.model_state_yc`.
  - name: prot_model_state_u
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.prot_model_state_u
    label: Prot Model state U
    description: Tracks Prot Model state U in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.prot_model_state_u`.
  - name: prot_f
    maps_to: cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.prot_f
    label: Prot F
    description: Tracks Prot F in the lab model via `cellcycle_sbml_model_of_budding_yeast_critical_cell_size_depend_model1808310001_model.prot_f`.
