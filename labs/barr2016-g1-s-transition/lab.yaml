  - name: cyclin_e
    maps_to: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.cyclin_e
    label: Cyclin E
    description: Tracks Cyclin E in the lab model via `cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.cyclin_e`.
  - name: cyclin_a
