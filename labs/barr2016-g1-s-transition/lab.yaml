    label: P27T
    description: Controls P27T in the lab model via `cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.p27t`.
  - name: emi_model_state_c
    maps_to: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.emi_model_state_c
    label: Emi Model state C
    description: Controls Emi Model state C in the lab model via `cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.emi_model_state_c`.
  - name: emi1t
