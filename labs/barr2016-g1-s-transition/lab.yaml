  - name: cyclin_et
    maps_to: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.cyclin_et
    label: Cyclin ET
    description: Controls Cyclin ET in the lab model via `cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.cyclin_et`.
  - name: cyclin_at
    maps_to: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.cyclin_at
