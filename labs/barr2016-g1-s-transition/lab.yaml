schema_version: '2.0'
title: Barr2016 - All-or-nothing G1/S transition Lab
description: 'Single-model lab wrapper for Barr2016 - All-or-nothing G1/S transition. Barr2016 - All-or-nothing
  G1/Stransition This model is described in the article: A Dynamical Framework for the All-or-None G1/S Transition.
  Barr AR, Heldt FS, Zhang T, Bakal C, Nov\u00e1k B.'
models:
- alias: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.state
  to:
  - visualisation.cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model_state
- from: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.summary
  to:
  - visualisation.cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model_summary
- from: cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model.species_labels
  to:
  - visualisation.cellcycle_sbml_barr2016_all_or_nothing_g1_s_transition_biomd0000000646_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
