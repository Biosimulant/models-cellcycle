schema_version: '2.0'
title: Chen2004 - Cell Cycle Regulation
description: Chen2004 - Cell Cycle Regulation This is a hypothetical model of cell cycle that describes the molecular
  mechanism for regulating DNA synthesis, bud emergence, mitosis, and cell division in budding ye. It can be used
  to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
