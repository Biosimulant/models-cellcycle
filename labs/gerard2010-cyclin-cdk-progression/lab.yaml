schema_version: '2.0'
package: gerard2010-cyclin-cdk-progression
version: 1.0.0
title: Gerard2010 - Progression of mammalian cell cycle by successive activation of various cyclin cdk complexes
  Lab
description: Single-model lab wrapper for Gerard2010 - Progression of mammalian cell cycle by successive activation
  of various cyclin cdk complexes. We previously proposed a detailed, 39-variable model for the network of cyclin-dependent
  kinases (Cdks) that controls progression along the successive phases of the mammalian cell cycle. It can be used
  to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model.state
  to:
  - visualisation.cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model_state
- from: cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model.summary
  to:
  - visualisation.cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model_summary
- from: cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model.species_labels
  to:
  - visualisation.cellcycle_sbml_gerard2010_progression_of_mammalian_cell_cycle_b_biomd0000000941_model_species_labels
runtime:
