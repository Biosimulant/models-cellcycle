schema_version: '2.0'
package: li2009-caulobacter-asymmetric-cycle
version: 1.0.0
title: Li2009- Assymetric Caulobacter cell cycle Lab
description: Single-model lab wrapper for Li2009- Assymetric Caulobacter cell cycle. The asymmetric cell division
  cycle of Caulobacter crescentus is orchestrated by an elaborate gene-protein regulatory network, centered on three
  major control proteins, DnaA, GcrA and CtrA. It can be used to explore cell-cycle regulation dynamics and compare
  checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model.state
  to:
  - visualisation.cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model_state
- from: cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model.summary
  to:
  - visualisation.cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model_summary
- from: cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model.species_labels
  to:
  - visualisation.cellcycle_sbml_li2009_assymetric_caulobacter_cell_cycle_biomd0000000727_model_species_labels
runtime:
