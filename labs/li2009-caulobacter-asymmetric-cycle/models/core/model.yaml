schema_version: '2.0'
title: Li2009- Assymetric Caulobacter cell cycle
description: The asymmetric cell division cycle of Caulobacter crescentus is orchestrated by an elaborate gene-protein
  regulatory network, centered on three major control proteins, DnaA, GcrA and CtrA. It can be used to explore cell-cycle
  regulation dynamics and compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Shenghua Li
- Paul Brazhnik
- Bruno Sobral
- John J Tyson
