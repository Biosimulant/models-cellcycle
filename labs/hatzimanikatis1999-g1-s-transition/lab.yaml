title: Hatzimanikatis1999-Regulation of the G1-S transition of the mammalian cell cycle. Lab
description: Single-model lab wrapper for Hatzimanikatis1999-Regulation of the G1-S transition of the mammalian
  cell cycle.. A mathematical model of regulation of the G1-S transition of the mammalian cell cycle has been formulated
  to organize available experimental molecular-level information in a systematic quantitative fr. It can be used
  to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
