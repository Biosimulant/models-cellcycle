schema_version: '2.0'
title: Lang2024 - Cell cycle model explains compartment-resolved dynamics of 16 observables in RPE1 cells
description: This model provides a molecularly detailed description of the biochemical reaction networks governing
  the mammalian cell cycle, including the restriction point, the G1S, G2/M and metaphase/anaphase tr. It can be
  used to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
