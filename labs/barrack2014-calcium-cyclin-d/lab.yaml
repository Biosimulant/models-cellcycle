schema_version: '2.0'
title: Barrack2014 - Calcium/cell cycle coupling - Cyclin D dependent ATP release Lab
description: Single-model lab wrapper for Barrack2014 - Calcium/cell cycle coupling - Cyclin D dependent ATP release.
  Barrack2014 - Calcium/cell cycle coupling - Cyclin D dependent ATP release This model is designed based on the
  hypothesis that cytoplasmic calcium accelerates entry into S phase of the cell cycle and/. It can be used to explore
  cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
