schema_version: '2.0'
title: DeBoeck2021 - Modular approach to modeling the cell cycle, 5 ODE model with 3 bistable switches
description: 'Model of the mammalian cell cycle as a chain of bistable switches. There are three bistable responses:
  response of E2F to Cyclin D, of Cdk1 to Cyclin B and of APC/C to Cdk1 activity.'
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- De Boeck J
- Jan Rombouts
- Gelens L
upstream:
  id: biomodels_ebi:BIOMD0000001080
  source_db: biomodels_ebi
  source_id: BIOMD0000001080
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000001080
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000001080?filename=DeBoeck2021_cellcycle_threeswitches.xml
  license: CC0
biosim:
  entrypoint: src.deboeck2021_modular_approach_to_modeling_the_cel_biomd0000001080_model:Deboeck2021ModularApproachToModelingTheCelBiomd0000001080Model
  init_kwargs:
    model_path: data/BIOMD0000001080.xml
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  outputs:
  - name: cyclin_d
    maps_to: CycD
    label: Cyclin D
    description: Tracks Cyclin D. Maps to SBML symbol `CycD`.
  - name: cyclin_b
    maps_to: CycB
    label: Cyclin B
    description: Tracks Cyclin B. Maps to SBML symbol `CycB`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream visualisation.
  - name: summary
    description: Largest-change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML symbols to human-friendly labels.
  inputs: []
