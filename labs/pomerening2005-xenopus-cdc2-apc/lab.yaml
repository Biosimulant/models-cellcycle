schema_version: '2.0'
title: Pomerening2005- Model of the Xenopus Cdc2/APC System Lab
description: 'Single-model lab wrapper for Pomerening2005- Model of the Xenopus Cdc2/APC System. The cell-cycle
  oscillator includes an essential negative-feedback loop: Cdc2 activates the anaphase-promoting complex (APC),
  which leads to cyclin destruction and Cdc2 inactivation. It can be used to explore cell-cycle regulation dynamics
  and compare checkpoint behavior across conditions.'
