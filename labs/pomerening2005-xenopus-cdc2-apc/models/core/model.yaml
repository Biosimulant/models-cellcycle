schema_version: '2.0'
title: Pomerening2005- Model of the Xenopus Cdc2/APC System
description: 'The cell-cycle oscillator includes an essential negative-feedback loop: Cdc2 activates the anaphase-promoting
  complex (APC), which leads to cyclin destruction and Cdc2 inactivation. It can be used to explore cell-cycle regulation
  dynamics and compare checkpoint behavior across conditions.'
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- Joseph R Pomerening
- Sun Young Kim
- James E Ferrell
