schema_version: '2.0'
package: ferrel2011-cdk1-oscillator-v2
version: 1.0.0
title: ferrel2011 - autonomous biochemical oscillator in cell cycle in Xenopus laevis v2 Lab
description: Single-model lab wrapper for ferrel2011 - autonomous biochemical oscillator in cell cycle in Xenopus
  laevis v2. Computational modeling and the theory of nonlinear dynamical systems allow one to not simply describe
  the events of the cell cycle, but also to understand why these events occur, just as the theory of. It can be
  used to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model.state
  to:
  - visualisation.cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model_state
- from: cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model.summary
  to:
  - visualisation.cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model_summary
- from: cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model.species_labels
  to:
  - visualisation.cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs: []
  outputs:
  - name: cdk1_active
    maps_to: cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model.cdk1_active
    label: CDK1 Active
    description: Tracks CDK1 Active in the lab model via `cellcycle_sbml_ferrel2011_autonomous_biochemical_oscillator_in_biomd0000000936_model.cdk1_active`.
