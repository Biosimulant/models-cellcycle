schema_version: '2.0'
title: Tyson1991 - Cell Cycle 2 var
description: Tyson1991 - Cell Cycle 2 var Mathematical model of the interactions of cdc2 and cyclin. It can be used
  to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
