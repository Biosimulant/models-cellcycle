schema_version: '2.0'
title: Ferrel2011 - Cdk1 and APC regulation in cell cycle in Xenopus laevis
description: Mathematical model of the regulation of Cdk1 and APC in cell cycle in Xenopus Laevis. It can be used
  to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- James E Ferrell
- Tsai TY
- Qiong Yang
upstream:
  id: biomodels_ebi:BIOMD0000000935
  source_db: biomodels_ebi
  source_id: BIOMD0000000935
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000935
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000935?filename=Ferrel2011.xml
  license: CC0
biosim:
  entrypoint: src.ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model:Ferrel2011Cdk1AndApcRegulationInCellCycleBiomd0000000935Model
  init_kwargs:
    model_path: data/BIOMD0000000935.xml
  communication_step: 0.01
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  outputs:
  - name: cdk1_active
    maps_to: CDK1_active
    label: CDK1 Active
    description: Tracks CDK1 Active. Maps to SBML symbol `CDK1_active`.
  - name: apc_c_c_active
    maps_to: APC_active
    label: APC/C/C Active
    description: Tracks APC/C/C Active. Maps to SBML symbol `APC_active`.
  - name: state
    description: Full raw SBML observable record for reproducibility and downstream visualisation.
  - name: summary
    description: Largest-change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML symbols to human-friendly labels.
  inputs: []
