schema_version: '2.0'
package: ferrel2011-cdk1-apc-regulation
version: 1.0.0
title: Ferrel2011 - Cdk1 and APC regulation in cell cycle in Xenopus laevis Lab
description: Single-model lab wrapper for Ferrel2011 - Cdk1 and APC regulation in cell cycle in Xenopus laevis.
  Mathematical model of the regulation of Cdk1 and APC in cell cycle in Xenopus Laevis. It can be used to explore
  cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.state
  to:
  - visualisation.cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model_state
- from: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.summary
  to:
  - visualisation.cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model_summary
- from: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.species_labels
  to:
  - visualisation.cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs: []
  outputs:
  - name: cdk1_active
    maps_to: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.cdk1_active
    label: CDK1 Active
    description: Tracks CDK1 Active in the lab model via `cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.cdk1_active`.
  - name: apc_c_c_active
    maps_to: cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.apc_c_c_active
    label: APC/C/C Active
    description: Tracks APC/C/C Active in the lab model via `cellcycle_sbml_ferrel2011_cdk1_and_apc_regulation_in_cell_cycle_biomd0000000935_model.apc_c_c_active`.
