schema_version: '2.0'
package: novak1997-dna-replication-control
version: 1.0.0
title: Novak1997 - Cell Cycle Lab
description: 'Single-model lab wrapper for Novak1997 - Cell Cycle. Novak1997 - Cell Cycle Modeling the control of
  DNA replication in fission yeast. This model is described in the article: Modeling the control of DNA replication
  in fission yeast.'
models:
- alias: cellcycle_sbml_novak1997_cell_cycle_biomd0000000007_model
  path: models/core
- alias: visualisation
