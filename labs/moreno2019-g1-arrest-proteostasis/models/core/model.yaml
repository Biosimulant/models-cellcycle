schema_version: '2.0'
title: Moreno2019 - Stochastic model of G1 arrest due to proteostasis decline delimits replicative lifespan in yeast
description: "This model is described within the paper: A G1 arrest due to proteostasis decline delimits replicative\
  \ lifespan in yeastDavid F. Moreno, Kirsten Jenkins, Sandrine Morlot, Gilles Charvin, Attila Csik\xE1s."
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- David F Moreno
- Kirsten Jenkins
- Sandrine Morlot
- Gilles Charvin
- Attila Csikasz-Nagy
upstream:
  id: biomodels_ebi:MODEL1901210001
  source_db: biomodels_ebi
  source_id: MODEL1901210001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1901210001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1901210001?filename=CellCycleProteinAggregation.xml
  license: CC0
biosim:
  entrypoint: src.moreno2019_stochastic_model_of_g1_arrest_due_to_model1901210001_model:Moreno2019StochasticModelOfG1ArrestDueToModel1901210001Model
  init_kwargs:
    model_path: data/MODEL1901210001.xml
  communication_step: 0.01
runtime:
