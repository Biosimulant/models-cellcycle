    description: Tracks Cdc20 APC/C activator in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cdc20_apc_c_activator`.
  - name: cdc20_t
    maps_to: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cdc20_t
    label: Cdc20 T
    description: Tracks Cdc20 T in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cdc20_t`.
  - name: hct1_apc_c_activator
