schema_version: '2.0'
package: chen2000-budding-yeast-cell-cycle
version: 1.0.0
title: Chen2000_CellCycle Lab
description: 'Single-model lab wrapper for Chen2000_CellCycle. This a model from the article: Kinetic analysis of
  a molecular model of the budding yeast cell cycle. Chen KC, Csikasz-Nagy A, Gyorffy B, Val J, Novak B, Tyson JJ.'
models:
- alias: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.state
  to:
  - visualisation.cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model_state
- from: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.summary
  to:
  - visualisation.cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model_summary
- from: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.species_labels
  to:
  - visualisation.cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs:
  - name: hct1_t
    maps_to: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.hct1_t
    label: Hct1 T
    description: Controls Hct1 T in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.hct1_t`.
  - name: bck2_0
    maps_to: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.bck2_0
    label: Bck2 0
    description: Controls Bck2 0 in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.bck2_0`.
  - name: cln3_max
    maps_to: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cln3_max
    label: Cln3 Max
    description: Controls Cln3 Max in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cln3_max`.
  outputs:
  - name: cln2_g1_cyclin
    maps_to: cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cln2_g1_cyclin
    label: Cln2 G1 cyclin
    description: Tracks Cln2 G1 cyclin in the lab model via `cellcycle_sbml_chen2000_cellcycle_biomd0000000675_model.cln2_g1_cyclin`.
  - name: cdc20_apc_c_activator
