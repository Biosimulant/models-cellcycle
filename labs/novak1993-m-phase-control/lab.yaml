schema_version: '2.0'
title: Novak1993 - Cell cycle M-phase control Lab
description: Single-model lab wrapper for Novak1993 - Cell cycle M-phase control. Novak1993 - Cell cycle M-phase
  control The model reproduces Figure 9 of the paper. It can be used to explore cell-cycle regulation dynamics and
  compare checkpoint behavior across conditions.
