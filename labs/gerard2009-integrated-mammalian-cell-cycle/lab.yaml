schema_version: '2.0'
title: Gerard2009 - An Integrated Mammalian Cell Cycle Model Lab
description: Single-model lab wrapper for Gerard2009 - An Integrated Mammalian Cell Cycle Model. We propose an integrated
  computational model for the network of cyclin-dependent kinases (Cdks) that controls the dynamics of the mammalian
  cell cycle. It can be used to explore cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
