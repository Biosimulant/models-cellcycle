schema_version: '2.0'
title: Gerard2009 - An Integrated Mammalian Cell Cycle Model
description: We propose an integrated computational model for the network of cyclin-dependent kinases (Cdks) that
  controls the dynamics of the mammalian cell cycle. It can be used to explore cell-cycle regulation dynamics and
  compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- "Claude G\xE9rard"
- Albert Goldbeter
