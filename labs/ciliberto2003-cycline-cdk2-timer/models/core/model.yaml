  source_db: biomodels_ebi
  source_id: BIOMD0000000697
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000697
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000697?filename=BIOMD0000000697_url.xml
  license: CC0
biosim:
