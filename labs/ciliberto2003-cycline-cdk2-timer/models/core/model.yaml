    label: Xic CDK inhibitor
    description: Tracks Xic CDK inhibitor. Maps to SBML symbol `Xic`.
  - name: xic_cdk2_cyclin_e
    maps_to: Xic_Cdk2_CycE
    label: Xic CDK2 Cyclin E
    description: Tracks Xic CDK2 Cyclin E. Maps to SBML symbol `Xic_Cdk2_CycE`.
  - name: xic_pcdk2_cyclin_e
    maps_to: Xic_PCdk2_CycE
    label: Xic PCdk2 Cyclin E
    description: Tracks Xic PCdk2 Cyclin E. Maps to SBML symbol `Xic_PCdk2_CycE`.
  - name: xic_cdk2_cyclin_erem
    maps_to: Xic_Cdk2_CycErem
    label: Xic CDK2 Cyclin Erem
    description: Tracks Xic CDK2 Cyclin Erem. Maps to SBML symbol `Xic_Cdk2_CycErem`.
  - name: xic_pcdk2_cyclin_erem
    maps_to: Xic_PCdk2_CycErem
    label: Xic PCdk2 Cyclin Erem
    description: Tracks Xic PCdk2 Cyclin Erem. Maps to SBML symbol `Xic_PCdk2_CycErem`.
  - name: removed_xic_inhibitor_pool
    maps_to: Xicrem
