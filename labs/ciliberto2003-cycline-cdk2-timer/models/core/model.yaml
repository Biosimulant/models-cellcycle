  - name: summary
    description: Largest-change and peak summary across the simulated SBML observables.
  - name: species_labels
    description: Mapping from raw SBML symbols to human-friendly labels.
  inputs:
  - name: wee1_total
    maps_to: Wee1_total
    label: Wee1 Total
    accepted_units:
    - native SBML value
    description: Controls Wee1 Total. Maps to SBML symbol `Wee1_total`.
  - name: cyclin_total
