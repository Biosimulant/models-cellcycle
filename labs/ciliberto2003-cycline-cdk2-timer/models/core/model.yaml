    maps_to: Cdk2_CycErem
    label: CDK2 Cyclin Erem
    description: Tracks CDK2 Cyclin Erem. Maps to SBML symbol `Cdk2_CycErem`.
  - name: pcdk2_cyclin_erem
    maps_to: PCdk2_CycErem
    label: PCdk2 Cyclin Erem
    description: Tracks PCdk2 Cyclin Erem. Maps to SBML symbol `PCdk2_CycErem`.
  - name: oxygen_dependent_degradation_factor_cyclin_e
    maps_to: Deg_a
    label: Oxygen-dependent degradation factor Cyclin E
    description: Tracks Oxygen-dependent degradation factor Cyclin E. Maps to SBML symbol `Deg_a`.
  - name: xic_cdk_inhibitor
