    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.mad1_c_mad2
    label: Mad1:C Mad2
    description: Tracks Mad1:C Mad2 in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.mad1_c_mad2`.
  - name: o_mad2
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.o_mad2
    label: O Mad2
    description: Tracks O Mad2 in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.o_mad2`.
  - name: mad1_c_mad2_o_mad2
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.mad1_c_mad2_o_mad2
    label: Mad1:C Mad2:O Mad2*
    description: Tracks Mad1:C Mad2:O Mad2* in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.mad1_c_mad2_o_mad2`.
  - name: cdc20_apc_c_activator
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.cdc20_apc_c_activator
    label: Cdc20 APC/C activator
    description: Tracks Cdc20 APC/C activator in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.cdc20_apc_c_activator`.
  - name: cdc20_c_mad2
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.cdc20_c_mad2
