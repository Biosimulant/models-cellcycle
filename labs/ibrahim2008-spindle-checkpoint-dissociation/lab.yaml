schema_version: '2.0'
package: ibrahim2008-spindle-checkpoint-dissociation
version: 1.0.0
title: Ibrahim2008 - Mitotic Spindle Assembly Checkpoint - Dissociation variant Lab
description: Single-model lab wrapper for Ibrahim2008 - Mitotic Spindle Assembly Checkpoint - Dissociation variant.
  Ibrahim2008 - Mitotic Spindle Assembly Checkpoint - Dissociation variant The Mitotic Spindle Assembly Checkpoint
  ((M)SAC) is an evolutionary conserved mechanism. It can be used to explore cell-cycle regulation dynamics and
  compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.state
  to:
  - visualisation.cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model_state
- from: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.summary
  to:
  - visualisation.cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model_summary
- from: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.species_labels
  to:
  - visualisation.cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs: []
  outputs:
