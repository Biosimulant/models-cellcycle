    description: Tracks Bub3:Bub R1:Cdc20 in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.bub3_bub_r1_cdc20`.
  - name: apc_c_c
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.apc_c_c
