  - name: bub3_bub_model_state_r1
    maps_to: cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.bub3_bub_model_state_r1
    label: Bub3:Bub Model state R1
    description: Tracks Bub3:Bub Model state R1 in the lab model via `cellcycle_sbml_ibrahim2008_mitotic_spindle_assembly_checkpoint_biomd0000000186_model.bub3_bub_model_state_r1`.
