    maps_to: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.e2ft
    label: E2FT
    description: Controls E2FT in the lab model via `cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.e2ft`.
  - name: pp1t
    maps_to: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.pp1t
    label: PP1T
    description: Controls PP1T in the lab model via `cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.pp1t`.
  - name: rb_t
    maps_to: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.rb_t
    label: Rb T
    description: Controls Rb T in the lab model via `cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.rb_t`.
  - name: cyclin_et
    maps_to: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.cyclin_et
    label: Cyclin ET
    description: Controls Cyclin ET in the lab model via `cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.cyclin_et`.
