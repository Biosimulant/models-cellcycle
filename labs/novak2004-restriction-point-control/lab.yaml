schema_version: '2.0'
title: Novak2004 - A Model for Restriction Point Control of the Mammalian Cell Cycle Lab
description: Single-model lab wrapper for Novak2004 - A Model for Restriction Point Control of the Mammalian Cell
  Cycle. &lt;notes xmlns='http://www.sbml.org/sbml/level2/version4'&gt; &lt;body xmlns='http://www.w3.org/1999/xhtml'&gt;
  &lt;pre&gt;Inhibition of protein synthesis by cycloheximide blocks subsequent division. It can be used to explore
  cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.state
  to:
  - visualisation.cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model_state
- from: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.summary
  to:
  - visualisation.cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model_summary
- from: cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model.species_labels
  to:
  - visualisation.cellcycle_sbml_novak2004_a_model_for_restriction_point_control_model2006080001_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
