schema_version: '2.0'
package: liu2012-stochastic-cell-cycle
version: 1.0.0
title: Liu2012-Hybrid modeling and simulation of stochastic effects on progression through the eukaryotic cell cycle.
  Lab
description: Single-model lab wrapper for Liu2012-Hybrid modeling and simulation of stochastic effects on progression
  through the eukaryotic cell cycle.. The eukaryotic cell cycle is regulated by a complicated chemical reaction
  network. Although many deterministic models have been proposed, stochastic models are desired to capture noise
  in the cell res.
models:
- alias: cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model.state
  to:
  - visualisation.cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model_state
- from: cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model.summary
  to:
  - visualisation.cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model_summary
- from: cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model.species_labels
  to:
  - visualisation.cellcycle_sbml_liu2012_hybrid_modeling_and_simulation_of_stocha_model2004140002_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
