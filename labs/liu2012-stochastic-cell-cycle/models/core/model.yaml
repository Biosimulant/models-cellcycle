title: Liu2012-Hybrid modeling and simulation of stochastic effects on progression through the eukaryotic cell cycle.
description: The eukaryotic cell cycle is regulated by a complicated chemical reaction network. Although many deterministic
  models have been proposed, stochastic models are desired to capture noise in the cell res.
