title: "G\xE9rard - 2019 - Coupling the cell cycle and the cell transformation networks (SBML) Lab"
description: "Single-model lab wrapper for G\xE9rard - 2019 - Coupling the cell cycle and the cell transformation\
  \ networks (SBML). Model for the Let-7-mediated coupling between the CDK network driving the cell cycle and the\
  \ malignant cell transformation network. It can be used to explore cell-cycle regulation dynamics and compare\
  \ checkpoint behavior across conditions."
