    label: Cdc25Ps216 Inactive
    description: Tracks Cdc25Ps216 Inactive in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25ps216_inactive`.
  - name: phosphorylated_chk1
    maps_to: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.phosphorylated_chk1
    label: Phosphorylated Chk1
    description: Tracks Phosphorylated Chk1 in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.phosphorylated_chk1`.
  - name: protein_14_3_3
