    label: p53 tumor suppressor
    description: Tracks p53 tumor suppressor in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.p53_tumor_suppressor`.
  - name: p21
