schema_version: '2.0'
package: aguda1999-g2-dna-damage-checkpoint-models-cellcycle
version: 1.0.0
title: Aguda1999 - G2 DNA damage checkpoint Lab
description: Single-model lab wrapper for Aguda1999 - G2 DNA damage checkpoint. Baltazar D. It can be used to explore
  cell-cycle regulation dynamics and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.state
  to:
  - visualisation.cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model_state
- from: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.summary
  to:
  - visualisation.cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model_summary
- from: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.species_labels
  to:
  - visualisation.cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model_species_labels
runtime:
  duration: 10.0
  communication_step: 1.0
  initial_inputs: {}
io:
  inputs:
  - name: cdc25_active_total
    maps_to: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_active_total
    label: Cdc25 Active Total
    description: Controls Cdc25 Active Total in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_active_total`.
  outputs:
  - name: cdc25_active
    maps_to: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_active
    label: Cdc25 Active
    description: Tracks Cdc25 Active in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_active`.
  - name: cdc25ps216_active
    maps_to: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25ps216_active
    label: Cdc25Ps216 Active
    description: Tracks Cdc25Ps216 Active in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25ps216_active`.
  - name: cdc25_inactive
    maps_to: cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_inactive
    label: Cdc25 Inactive
    description: Tracks Cdc25 Inactive in the lab model via `cellcycle_sbml_aguda1999_g2_dna_damage_checkpoint_biomd0000000704_model.cdc25_inactive`.
  - name: cdc25ps216_inactive
