schema_version: '2.0'
title: Aguda1999 - G2 DNA damage checkpoint
description: Baltazar D. It can be used to explore cell-cycle regulation dynamics and compare checkpoint behavior
  across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
- Biosimulant Team
- B D Aguda
upstream:
  id: biomodels_ebi:BIOMD0000000704
  source_db: biomodels_ebi
  source_id: BIOMD0000000704
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000704
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000704?filename=BIOMD0000000704_url.xml
  license: CC0
biosim:
