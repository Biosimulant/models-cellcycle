- from: cellcycle_sbml_ciliberto2003_morphogenesis_checkpoint_biomd0000000297_model.species_labels
  to:
  - visualisation.cellcycle_sbml_ciliberto2003_morphogenesis_checkpoint_biomd0000000297_model_species_labels
