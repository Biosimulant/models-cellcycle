schema_version: '2.0'
package: ciliberto2003-morphogenesis-checkpoint
version: 1.0.0
title: Ciliberto2003_Morphogenesis_Checkpoint Lab
description: 'Single-model lab wrapper for Ciliberto2003_Morphogenesis_Checkpoint. This a model from the article:
  Mathematical model of the morphogenesis checkpoint in budding yeast. It can be used to explore cell-cycle regulation
  dynamics and compare checkpoint behavior across conditions.'
models:
- alias: cellcycle_sbml_ciliberto2003_morphogenesis_checkpoint_biomd0000000297_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
