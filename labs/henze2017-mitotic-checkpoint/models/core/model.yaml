schema_version: '2.0'
title: Henze2017 - A Dynamical Model for Activating and Silencing the Mitotic Checkpoint
description: The spindle assembly checkpoint (SAC) is an evolutionarily conserved mechanism, exclusively sensitive
  to the states of kinetochores attached to microtubules. It can be used to explore cell-cycle regulation dynamics
  and compare checkpoint behavior across conditions.
standard: other
tags:
- cellcycle
- sbml
- biomodels_ebi
- faithful
authors:
