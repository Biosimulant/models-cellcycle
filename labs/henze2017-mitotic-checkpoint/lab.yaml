schema_version: '2.0'
package: henze2017-mitotic-checkpoint
version: 1.0.0
title: Henze2017 - A Dynamical Model for Activating and Silencing the Mitotic Checkpoint Lab
description: Single-model lab wrapper for Henze2017 - A Dynamical Model for Activating and Silencing the Mitotic
  Checkpoint. The spindle assembly checkpoint (SAC) is an evolutionarily conserved mechanism, exclusively sensitive
  to the states of kinetochores attached to microtubules. It can be used to explore cell-cycle regulation dynamics
  and compare checkpoint behavior across conditions.
models:
- alias: cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model
  path: models/core
- alias: visualisation
  path: models/visualisation
wiring:
- from: cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model.state
  to:
  - visualisation.cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model_state
- from: cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model.summary
  to:
  - visualisation.cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model_summary
- from: cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model.species_labels
  to:
  - visualisation.cellcycle_sbml_henze2017_a_dynamical_model_for_activating_and_s_model1812210002_model_species_labels
